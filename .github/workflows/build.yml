name: Build AIRI APK

# Builds the experimental Android app (Stage Pocket, Capacitor) from the public
# moeru-ai/airi repository and publishes a debug APK to the "latest" release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "moeru-ai/airi branch, tag or commit to build"
        default: main
        required: false

# The build job runs third-party code (airi's install scripts), so it gets a
# read-only token. Only the small release job below is allowed to write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AIRI
        uses: actions/checkout@v4
        with:
          repository: moeru-ai/airi
          ref: ${{ inputs.ref || 'main' }}
          path: airi
          persist-credentials: false

      - name: Set up Node (version pinned by AIRI)
        uses: actions/setup-node@v4
        with:
          node-version-file: airi/.tool-versions

      - name: Set up pnpm (version pinned by AIRI)
        run: |
          PNPM_VERSION=$(awk '$1=="pnpm"{print $2}' airi/.tool-versions)
          echo "Installing pnpm $PNPM_VERSION"
          npm install -g "pnpm@$PNPM_VERSION"
          node --version
          pnpm --version

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: airi
        run: pnpm install --frozen-lockfile

      - name: Build web assets for Stage Pocket
        working-directory: airi
        run: pnpm -F @proj-airi/stage-pocket build

      - name: Prepare Android project
        working-directory: airi/apps/stage-pocket
        run: |
          if [ ! -d android ]; then
            echo "No android/ folder in the repo, creating one with Capacitor"
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Build debug APK
        working-directory: airi/apps/stage-pocket/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find airi/apps/stage-pocket/android -name '*.apk' -path '*debug*' | head -n 1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          echo "Found $APK"
          mkdir -p out
          cp "$APK" out/AIRI.apk
          ls -l out
          echo "AIRI_COMMIT=$(git -C airi rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-debug-apk
          path: out/AIRI.apk
          if-no-files-found: error

      - name: Save AIRI commit id
        run: echo "$AIRI_COMMIT" > out/airi-commit.txt

      - name: Upload commit id
        uses: actions/upload-artifact@v4
        with:
          name: airi-commit
          path: out/airi-commit.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: AIRI-debug-apk

      - name: Download commit id
        uses: actions/download-artifact@v4
        with:
          name: airi-commit

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          AIRI_COMMIT=$(cat airi-commit.txt)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AIRI.apk \
            --target "$GITHUB_SHA" \
            --title "AIRI Android (debug build)" \
            --notes "Unofficial debug APK of moeru-ai/airi (Stage Pocket), built from airi commit ${AIRI_COMMIT}. Experimental." \
            --prerelease
